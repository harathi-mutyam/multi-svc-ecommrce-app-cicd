apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: user-service
  namespaceSelector:
    matchNames: [ecommerce]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
