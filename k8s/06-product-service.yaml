apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: REPLACE_ECR/ecommerce/product-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: DB_HOST
              value: product-db
            - name: DB_NAME
              value: products
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
