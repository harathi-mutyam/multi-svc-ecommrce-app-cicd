apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx
  namespace: ecommerce
data:
  default.conf: |
    server {
      listen 8080;

      location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
      }

      location /users/health {
        proxy_pass http://user-service:5001/health;
      }

      location /products/health {
        proxy_pass http://product-service:5002/health;
      }

      location /orders/health {
        proxy_pass http://order-service:5003/health;
      }

      location /users {
        proxy_pass http://user-service:5001/users;
      }

      location /products {
        proxy_pass http://product-service:5002/products;
      }

      location /orders {
        proxy_pass http://order-service:5003/orders;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 263860684319.dkr.ecr.eu-north-1.amazonaws.com/ecommerce/api-gateway:6f824de4f96f
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: api-gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
